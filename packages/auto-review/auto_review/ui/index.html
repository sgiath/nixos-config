<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex" />
    <title>auto-review</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050505'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%23e25d52' stroke-opacity='.3' stroke-width='1.5'/%3E%3Ccircle cx='24.1' cy='7.9' r='2.2' fill='%23e25d52'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%23e25d52'/%3E%3C/svg%3E"
    />
    <link rel="preload" href="/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">skip to content</a>
    <div class="page">
      <header class="site-header">
        <div class="brand-block">
          <!-- the one motif of the page: a small orrery; it stands still while the service is paused -->
          <svg class="motif" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <g transform="translate(20 20)" fill="none" stroke="currentColor">
              <g transform="rotate(-22) scale(1 0.42)">
                <circle r="7" stroke-opacity="0.28" vector-effect="non-scaling-stroke" />
                <g class="orbit-revolve" style="--orbit-period: 48s; animation-delay: -11s">
                  <path d="M7 0l0.0001 0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" vector-effect="non-scaling-stroke" />
                </g>
              </g>
              <g transform="rotate(-22) scale(1 0.42)">
                <circle r="12" stroke-opacity="0.2" vector-effect="non-scaling-stroke" />
                <g class="orbit-revolve" style="--orbit-period: 120s; animation-delay: -73s">
                  <path d="M12 0l0.0001 0" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.7" vector-effect="non-scaling-stroke" />
                </g>
              </g>
              <g transform="rotate(-22) scale(1 0.42)">
                <circle r="17" stroke-opacity="0.14" vector-effect="non-scaling-stroke" />
                <g class="orbit-revolve" style="--orbit-period: 300s; animation-delay: -205s">
                  <path d="M17 0l0.0001 0" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.55" vector-effect="non-scaling-stroke" />
                </g>
              </g>
            </g>
            <circle class="sun" cx="20" cy="20" r="1.8" />
          </svg>
          <div class="min-w-0">
            <a class="brand" href="#/">auto<span class="accent">-</span>review</a>
            <p class="caption tagline" id="identities">local review service</p>
          </div>
        </div>
        <nav class="site-nav" aria-label="views">
          <a class="nav-item" href="#/" data-view="overview">overview</a>
          <a class="nav-item" href="#/history" data-view="history">history</a>
          <a class="nav-item" href="#/settings" data-view="settings">settings</a>
          <a class="nav-item" href="#/events" data-view="events">events</a>
        </nav>
      </header>

      <section class="readouts" id="status" aria-label="service status" aria-live="polite">
        <div class="readout"><span class="caption">mode</span><span class="value">…</span></div>
      </section>

      <main id="main" tabindex="-1"></main>

      <footer class="site-footer">
        <span class="caption">reviews run in t3 threads · comments are posted in your name</span>
      </footer>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  </body>
</html>
